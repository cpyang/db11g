# ============================================================
# Playbook: Install Oracle Grid Infrastructure 11gR2
# Installs and configures Grid Infrastructure on all RAC nodes
# ============================================================

- name: Install Oracle Grid Infrastructure 11gR2
  hosts: rac
  become: true
  gather_facts: yes
  serial: 1  # Install on first node, then second

  pre_tasks:
    - name: Verify OS prerequisites are met
      command: echo "Checking prerequisites on {{ inventory_hostname }}"
      changed_when: false

    - name: Ensure Oracle software packages are available
      stat:
        path: "{{ oracle_packages_dir }}/{{ oracle_grid_zip }}"
      register: grid_zip

    - name: Fail if Grid Infrastructure zip is not found
      fail:
        msg: "Grid Infrastructure zip file not found at {{ oracle_packages_dir }}/{{ oracle_grid_zip }}. Please place it there first."
      when: not grid_zip.stat.exists

  roles:
    - grid

  post_tasks:
    - name: Verify Grid Infrastructure installation
      command: "{{ grid_home }}/crsctl check crs"
      register: crs_status
      changed_when: false
      failed_when: false

    - name: Display CRS status
      debug:
        var: crs_status.stdout

    - name: Display next steps
      debug:
        msg: |
          Next steps:
          1. Run 04-install-db.yml to install Database software
          2. Run 05-create-database.yml to create the database
