# ============================================================
# Playbook 03 — Oracle Grid Infrastructure 11.2.0.4 install
# Phases are SEPARATE plays because 11.2 propagates from node1 and
# root.sh order is a hard requirement (node1 forms the cluster, node2
# joins it — never both at once).
# Run: ansible-playbook playbooks/03-install-grid.yml
# Idempotent: re-running skips completed phases via the stage guards.
# ============================================================

- name: GI preflight (media, ASM disks, NIC roles)
  hosts: rac
  gather_facts: true
  become: true
  vars:
    grid_stage: check
  roles:
    - grid

- name: GI software install (node1; propagates to node2)
  hosts: rac[0]
  gather_facts: true
  become: true
  vars:
    grid_stage: software
  roles:
    - grid

- name: root.sh — node1 (starts OCR/Vote + CRS; ~10 min)
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    grid_stage: root
  roles:
    - grid

- name: root.sh — node2 (joins existing cluster via ConfigNode)
  hosts: rac[1]
  gather_facts: false
  become: true
  vars:
    grid_stage: root
  roles:
    - grid

- name: DATA + FRA disk groups and cluster verification
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    grid_stage: dgs
  roles:
    - grid
