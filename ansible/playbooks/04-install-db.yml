# ============================================================
# Playbook 04 — Oracle Database 11.2.0.4 software-only install
# Same phase model as 03 (node1 propagates; root.sh per node after).
# Run: ansible-playbook playbooks/04-install-db.yml
# Requires: playbook 03 completed (cluster online + CRS DG).
# ============================================================

- name: RDBMS preflight (media visible)
  hosts: rac
  gather_facts: false
  become: true
  vars:
    db_stage: check
  roles:
    - database

- name: RDBMS software install (node1; propagates to node2)
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    db_stage: software
  roles:
    - database

- name: DB home root.sh (setuid oracle binary) — every node, node1 first
  hosts: rac
  gather_facts: false
  become: true
  serial: 1
  vars:
    db_stage: root
  roles:
    - database

- name: Post-install verification + client TNS aliases
  hosts: rac
  gather_facts: false
  become: true
  vars:
    db_stage: verify
  roles:
    - database
