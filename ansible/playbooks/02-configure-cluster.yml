# ============================================================
# Playbook: Configure Cluster Prerequisites
# Prepares shared storage and ASM disks for RAC
# ============================================================

- name: Configure shared storage and ASM disks
  hosts: rac
  become: true
  gather_facts: yes
  serial: 1  # Configure nodes one at a time

  pre_tasks:
    - name: Verify shared disks are accessible
      command: lsblk
      register: lsblk_output

    - name: Display disk information
      debug:
        var: lsblk_output.stdout

  roles:
    - common

  post_tasks:
    - name: Verify ASM disks are configured
      command: ls -l /dev/oracleasm/disks/
      register: asm_disks
      changed_when: false

    - name: Display ASM disk status
      debug:
        var: asm_disks.stdout

    - name: Display next steps
      debug:
        msg: |
          Next steps:
          1. Run 03-install-grid.yml to install Grid Infrastructure
          2. Run 04-install-db.yml to install Database software
