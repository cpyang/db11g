# ============================================================
# Role: grid — Oracle Grid Infrastructure 11.2.0.4 (media: 3of7!)
#
# Install model (11.2.0.4): runInstaller runs on node1 ONLY and
# PROPAGATES the home to the other cluster nodes over the grid user's
# ssh trust — unlike the 19c lab's per-node path. That makes this role's
# phases strictly ordered:
#   stage=check     all nodes: media + ASM symlinks present
#   stage=software  node1: unzip media, generate rsp, runInstaller
#   stage=root      per node in order: root.sh (node1 starts CRS, node2
#                   joins — NEVER both at once)
#   stage=dgs       node1: asmca creates DATA + FRA (CRS dg came from the
#                   installer — OCR/voting live in it)
# ============================================================

- name: Resolve stage from play vars
  # NOTE the name split: the role never set_fact's grid_stage itself —
  # a set_fact OUTLANKS play vars in precedence, so rewriting it in play 1
  # pinned every later play to 'check' and 03/04 became no-op successes
  # (di chain 2026-10-21 20:36). Read grid_stage, resolve into grid_phase.
  set_fact:
    grid_phase: "{{ grid_stage | default('check') }}"

# ------------------------------------------------------------------ check
- name: Resolve NIC roles (needed by the rsp even on standalone runs)
  include_role:
    name: common
    tasks_from: resolve-interfaces
  when: grid_phase == 'check'

- name: Confirm media is mounted read-only at {{ oracle_stage_dir }}
  stat:
    path: "{{ oracle_stage_dir }}/{{ oracle_grid_zip }}"
  register: grid_media
  failed_when: not grid_media.stat.exists
  when: grid_phase == 'check'

- name: Confirm ASM discovery symlinks exist
  stat:
    path: "/dev/oracleasm/disks/{{ item }}"
  loop: [CRS, DATA, FRA]
  register: asm_links
  failed_when: not asm_links.stat.exists
  when: grid_phase == 'check'

# ------------------------------------------------------------------ software
- name: Detect existing GI home
  stat:
    path: "{{ grid_home }}/bin/crsctl"
  register: crsctl_bin
  when: grid_phase == 'software'

- name: Unarchive Grid Infrastructure media (node1; installer propagates)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ oracle_grid_zip }}"
    dest: "{{ oracle_media_dir }}"
    remote_src: true
    owner: grid
    group: "{{ oracle_installer_group }}"
  become_user: grid
  when:
    - grid_phase == 'software'
    - not crsctl_bin.stat.exists
    - inventory_hostname == groups['rac'][0]

- name: Render grid_install.rsp
  template:
    src: grid.rsp.j2
    dest: "{{ grid_install_tmp }}/grid_install.rsp"
    owner: grid
    group: "{{ oracle_installer_group }}"
    mode: '0600'      # contains ASM monitor/sys passwords
  when: grid_phase == 'software'

# 11.2.0.4 runInstaller returns 0 on success; non-zero here is a real abort.
# -ignorePrereq accepts CVU WARNINGS — do not use this run to paper over
# FAILURES; check the log below if it dies.
- name: Install GI software + configure cluster (node1 only, long-running)
  command: >-
    {{ oracle_media_dir }}/grid/runInstaller -silent
    -responseFile {{ grid_install_tmp }}/grid_install.rsp
    -ignorePrereq
    -waitforcompletion
  become_user: grid
  environment:
    ORACLE_HOSTNAME: "{{ inventory_hostname }}"
    TMPDIR: "{{ grid_install_tmp }}"
    LANG: en_US.UTF-8
  register: gi_install
  failed_when: gi_install.rc != 0
  timeout: 5400
  changed_when: true
  when:
    - grid_phase == 'software'
    - not crsctl_bin.stat.exists
    - inventory_hostname == groups['rac'][0]

- name: Show installer tail (empty list if the task was skipped)
  debug:
    msg: "{{ (gi_install.stderr_lines | default([]))[-10:] }}"
  when: grid_phase == 'software'

# ------------------------------------------------------------------ root.sh
# EL7 + 11.2.0.4 classic (hit live on di 2026-10-21 twice): root.sh formats
# OCR, registers ohasd in /etc/inittab — which systemd NEVER executes —
# then WAITS ~30 min and dies "Failed to start the Clusterware".
# Pre-starting ohasd is also wrong: root.sh's own 'ohasd reboot' spawn then
# fights the pre-started instance (double ohasd.bin = corrupt HAS state).
# Correct dance: run root.sh ASYNC, wait until it has formatted OCR/OLR and
# entered its wait loop, then start the stack PROPERLY (crsctl start crs)
# over the cleaned processes — root.sh's wait sees a live stack and
# completes. The systemd unit exists ONLY for post-reboot survival
# (installed+enabled, never started by this play).
- name: ohasd boot unit (install + enable only — never start here)
  copy:
    dest: /etc/systemd/system/ohasd.service
    mode: '0644'
    content: |
      [Unit]
      Description=Oracle HA stack boot bring-up (EL7 inittab workaround)
      After=syslog.target network.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      KillMode=none
      ExecStart=/bin/sh -c 'af=/etc/oracle/scls_scr/$(hostname | cut -d. -f1)/root/ohasdrun; echo restart > $af; setsid /bin/sh -c "echo \$\$ > /var/run/init.ohasd.supervisor.pid; exec /etc/rc.d/init.d/init.ohasd run" >>/var/log/init.ohasd.supervisor 2>&1 &'
      # Supervisor-loop form (see Start-HAS task for the pipe-pairing
      # postmortem). KillMode=none so systemd never reaps the detached
      # loop + daemon children (di 18:24).
      [Install]
      WantedBy=multi-user.target
  when: grid_phase == 'root'

- name: Enable boot unit (no state change on the running system)
  systemd:
    name: ohasd
    daemon_reload: true
    enabled: true
  when: grid_phase == 'root'

- name: Check whether CRS is already up on this node
  # DECEPTIVE: 'crsctl check crs' can exit rc 0 while printing 'PRCO-2:
  # Unable to communicate with the clusterware' on a dead stack (di
  # 2026-10-22 17:31 — both nodes skipped root.sh with the cluster down).
  # Never trust rc here; the stdout search is the guard.
  command: "timeout 30 {{ grid_home }}/bin/crsctl check crs"
  register: crs_up
  failed_when: false
  changed_when: false
  when: grid_phase == 'root'

- name: Run root.sh (first pass, dies at the EL7 ohasd respawn gap)
  # No interleave, no async. root.sh's own ~30-min wait happens BEFORE it
  # logs 'ohasd failed to start' (di 2026-10-21 16:16->16:52 timeline), so
  # a plain blocking run leaves no window to race. Everything through the
  # inittab write (OLR, gpnp profile/wallets, ohasdrun=reboot) is left
  # behind intact for the completion pass below.
  command: "{{ grid_home }}/root.sh"
  timeout: 3600
  register: rootsh_first
  failed_when: false
  changed_when: true
  when:
    - grid_phase == 'root'
    - crs_up.rc != 0 or 'CRS-4537' not in crs_up.stdout

- name: Verify first-pass failure is only the EL7 ohasd gap
  shell: |-
    if [ {{ rootsh_first.rc | default(0) }} -eq 0 ]; then echo CLEAN_PASS; exit 0; fi
    log=$(ls -t {{ grid_home }}/install/root_*.log 2>/dev/null | head -1)
    if [ -n "$log" ] && grep -q 'ohasd failed to start' "$log"; then
      echo EXPECTED_EL7_GAP; exit 0
    fi
    echo "UNEXPECTED root.sh failure — last 30 lines:"
    tail -30 "$log" 2>/dev/null
    exit 1
  changed_when: false
  when: rootsh_first is not skipped

- name: Start HAS so ohasd bootstraps from ohasdrun=reboot
  # The working piece is the init.ohasd RUN loop (the SysV inittab client,
  # which spawns ohasd.bin itself) — 'crsctl start has' only raises an
  # orphan ohasd.bin that logs CRS-0715 and dies (di 17:02-17:13 alert log).
  shell: |-
    {{ grid_home }}/bin/crsctl stop has -f >/dev/null 2>&1 || true
    sleep 5
    # Cleanup split by what pkill -x CAN see: ELF daemons (ohasd.bin,
    # crsd.bin, ocssd.bin — real comms) by name; the supervisor loop is a
    # bash COMM (init.ohasd is a script) so it goes by its pidfile.
    # pkill -f (ANY form) is forbidden here: this script's text lives in
    # the task shell's AND its ssh-ancestor cmdlines (rc -9, 18:13:40).
    if [ -f /var/run/init.ohasd.supervisor.pid ]; then
      kill -9 "$(cat /var/run/init.ohasd.supervisor.pid)" 2>/dev/null || true
      rm -f /var/run/init.ohasd.supervisor.pid
    fi
    for n in ohasd.bin crsd.bin ocssd.bin; do pkill -9 -x $n 2>/dev/null || true; done
    # ohasd.bin parks in a nanosleep loop until its init.ohasd supervisor
    # pipe partner exists (di 18:31: ohasd.bin alive, socket bound, check
    # has = CRS-4639 forever). The restart branch in the SysV loop is the
    # ONLY code path that execs bin/ohasd restart AND opens the pipe read
    # side; the reboot-state boot branch deadlocks under systemd (crsctl
    # start has inside that loop waits on this same pipe). So: set the
    # autorun state to restart first, then run the loop detached.
    af=/etc/oracle/scls_scr/$(hostname | cut -d. -f1 | tr 'A-Z' 'a-z')/root/ohasdrun
    echo restart > $af
    setsid /bin/sh -c 'echo $$ > /var/run/init.ohasd.supervisor.pid; exec /etc/rc.d/init.d/init.ohasd run' >>/var/log/init.ohasd.supervisor 2>&1 &
    for i in $(seq 1 48); do
      sleep 5
      {{ grid_home }}/bin/crsctl check has 2>/dev/null && exit 0
    done
    echo "HAS did not come up"
    exit 1
  changed_when: true
  when:
    - rootsh_first is not skipped
    - rootsh_first.rc != 0

- name: Run root.sh (second pass, completes with a live stack)
  command: "{{ grid_home }}/root.sh"
  timeout: 1800
  register: rootsh_second
  when:
    - rootsh_first is not skipped
    - rootsh_first.rc != 0

- name: OCR-IPC sanity (oracle-visible); cycle CRS if crsd wedged
  # A crsd left in bootstrap mode by interrupted passes serves crsctl
  # checks but not oracle-user OCR IPC -> later runInstaller reports
  # INS-35354 on a healthy cluster (di 2026-10-22 20:08 postmortem).
  shell: |-
    if sudo -u oracle {{ grid_home }}/bin/ocrcheck 2>&1 | grep -q "Version"; then
      echo OCR_IPC_OK
    else
      {{ grid_home }}/bin/crsctl stop crs -f >/dev/null 2>&1 || true
      sleep 10
      {{ grid_home }}/bin/crsctl start crs
      for i in $(seq 1 30); do
        sleep 10
        {{ grid_home }}/bin/crsctl check crs 2>/dev/null | grep -q 4537 && break
      done
      sudo -u oracle {{ grid_home }}/bin/ocrcheck 2>&1 | grep -q "Version" && echo OCR_IPC_CYCLED || exit 1
    fi
  register: ocr_ipc
  changed_when: "'CYCLED' in ocr_ipc.stdout"
  retries: 3
  delay: 20
  until: ocr_ipc.rc == 0
  failed_when: ocr_ipc.rc != 0
  when: grid_phase == 'root'

- name: Show root.sh result tail
  debug:
    msg: "{{ (rootsh_second.stdout_lines | default(rootsh_first.stdout_lines | default(['(root stage skipped or already online on this node)']))) | default([]) }}"
  when: grid_phase == 'root'

# ------------------------------------------------------------------ DGs
# Existence MUST be parsed from `crsctl stat res -t` output — both
# `asmcmd dg_exists` and `crsctl stat res <dg> -p` return rc 0 for absent
# disk groups (verified 2026-10-15/19 in the sibling lab). Do not "simplify"
# these guards back to rc checks.
- name: Read cluster resource table
  command: "{{ grid_home }}/bin/crsctl stat res -t"
  become_user: grid
  register: res_table
  changed_when: false
  when:
    - grid_phase == 'dgs'
    - inventory_hostname == groups['rac'][0]

- name: Create DATA disk group
  command: >-
    {{ grid_home }}/bin/asmca -silent -createDiskGroup
    -diskGroupName DATA
    -disk '/dev/oracleasm/disks/DATA'
    -redundancy EXTERNAL -au_size 4
    -compatible.asm 11.2 -compatible.rdbms 11.2
  become_user: grid
  environment:
    ORACLE_HOME: "{{ grid_home }}"
    ORACLE_SID: "+ASM{{ node_num }}"
  when:
    - grid_phase == 'dgs'
    - inventory_hostname == groups['rac'][0]
    - res_table.stdout is not search('(?i)ora\\.data\\.dg')

- name: Create FRA disk group
  command: >-
    {{ grid_home }}/bin/asmca -silent -createDiskGroup
    -diskGroupName FRA
    -disk '/dev/oracleasm/disks/FRA'
    -redundancy EXTERNAL -au_size 4
    -compatible.asm 11.2 -compatible.rdbms 11.2
  become_user: grid
  environment:
    ORACLE_HOME: "{{ grid_home }}"
    ORACLE_SID: "+ASM{{ node_num }}"
  when:
    - grid_phase == 'dgs'
    - inventory_hostname == groups['rac'][0]
    - res_table.stdout is not search('(?i)ora\\.fra\\.dg')

- name: Final cluster verification
  shell: >-
    {{ grid_home }}/bin/crsctl check cluster -all &&
    {{ grid_home }}/bin/olsnodes -n -s
  become_user: grid
  register: cluster_ok
  retries: 10
  delay: 30
  until: cluster_ok.rc == 0
  changed_when: false
  when:
    - grid_phase == 'dgs'
    - inventory_hostname == groups['rac'][0]

- name: Cluster status
  debug:
    msg: "{{ cluster_ok.stdout_lines | default(['(dgs stage not run on this node)']) }}"
  when: grid_phase == 'dgs'
