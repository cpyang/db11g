# Resolve NIC roles BY ADDRESS (never by ethX — the Vagrant box has
# eth0 = NAT first). Included by roles/common and by the grid role's
# check stage (so a standalone stage run can still render rsp files).
#
# ansible-core 2.16 fact API notes (hit live on di 2026-10-21):
#   * there is NO aggregated 'ansible_interface_facts' key in
#     ansible_facts — referencing it dies with "'dict object' has no
#     attribute". Per-interface facts live at ansible_facts[<ifname>].
#   * ansible_interfaces starts with 'lo' — it carries ipv4 127.0.0.1 and
#     would be mis-picked as the "NAT" NIC. Always exclude lo.
- name: Find public interface
  set_fact:
    pub_iface: "{{ item }}"
  loop: "{{ ansible_interfaces }}"
  when: >-
    item != 'lo' and
    ansible_facts[item]['ipv4'] is defined and
    ansible_facts[item]['ipv4'].get('address') == public_ip

- name: Find interconnect interface
  set_fact:
    priv_iface: "{{ item }}"
  loop: "{{ ansible_interfaces }}"
  when: >-
    item != 'lo' and
    ansible_facts[item]['ipv4'] is defined and
    ansible_facts[item]['ipv4'].get('address') == private_ip

- name: Find remaining addressed NIC (NAT) — response files mark it 'do not use'
  set_fact:
    nat_iface: "{{ item }}"
    nat_subnet: "{{ ansible_facts[item]['ipv4'].get('network', '10.0.2.0') }}"
  loop: "{{ ansible_interfaces }}"
  when: >-
    item != 'lo' and
    ansible_facts[item]['ipv4'] is defined and
    ansible_facts[item]['ipv4'].get('address') is defined and
    ansible_facts[item]['ipv4']['address'] not in [public_ip, private_ip] and
    nat_iface is not defined

- name: Assert interfaces resolved
  assert:
    that:
      - pub_iface is defined
      - priv_iface is defined
    fail_msg: >-
      No NIC carries {{ public_ip }} / {{ private_ip }}. Vagrant applies
      private_network IPs only on the FIRST boot — if these VMs were
      recreated over existing media, the NICs are unaddressed: halt, check
      `ip addr` in the guest, `vagrant destroy && vagrant up` if VM state
      was replaced (or re-add the static config per the playbook docs).
