# ============================================================
# Role: database — Oracle RDBMS 11.2.0.4 software (media: 1of7 + 2of7)
#
# Same install model as the grid role: runInstaller on node1 propagates
# to the peers listed in CLUSTER_NODES over oracle's ssh trust.
#   stage=check     media present (node1 mount)
#   stage=software  node1: unzip both parts, rsp, runInstaller
#   stage=root      per node: $OH/root.sh (setuid oracle binary)
#   stage=verify    per node: bin/oracle real + setuid; tnsnames alias
#
# bin/oracle SIZE guard: an install that never propagated leaves the
# remote home's bin/oracle as the zip's 0-byte placeholder while the
# install still reports success — size (not existence) is the check.
# ============================================================

- name: Resolve stage from play vars
  # see grid role: never overwrite db_stage itself (facts beat play vars)
  set_fact:
    db_phase: "{{ db_stage | default('check') }}"

# ------------------------------------------------------------------ check
- name: Confirm database media is visible on the staging mount
  stat:
    path: "{{ oracle_stage_dir }}/{{ item }}"
  loop: "{{ oracle_database_zips }}"
  register: db_media
  failed_when: not db_media.stat.exists
  when:
    - db_phase == 'check'
    - inventory_hostname == groups['rac'][0]   # only node1 runs the installer

# ------------------------------------------------------------------ software
- name: Detect a fully-populated DB home (bin/oracle > 1 MB)
  stat:
    path: "{{ oracle_home }}/bin/oracle"
  register: db_binary
  when: db_phase == 'software'

- name: Unarchive Database media (two parts overlay into database/)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ item }}"
    dest: "{{ oracle_media_dir }}"
    remote_src: true
    owner: oracle
    group: "{{ oracle_installer_group }}"
  become_user: oracle
  loop: "{{ oracle_database_zips }}"
  when:
    - db_phase == 'software'
    - not (db_binary.stat.exists | default(false) and db_binary.stat.size | default(0) > 1048576)
    - inventory_hostname == groups['rac'][0]

- name: Render db_install.rsp
  template:
    src: db_install.rsp.j2
    dest: "{{ grid_install_tmp }}/db_install.rsp"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0600'
  when:
    - db_phase == 'software'
    - inventory_hostname == groups['rac'][0]

- name: Install RDBMS software (node1; propagates to CLUSTER_NODES)
  # Single-line shell:11.2 silent install runs foreground to completion.
  # MUST NOT carry -waitforcompletion:
  # its wizard-reinit path blanks the ClusterContext (getCSSConfigType
  # configType=false in the trace) and runInstaller aborts INS-35354 no
  # matter how healthy the cluster is (di 2026-10-24 — this flag poisoned
  # the whole multi-day hunt). Without it, silent install runs to
  # completion in the foreground.
  shell: "{{ oracle_media_dir }}/database/runInstaller -silent -responseFile {{ grid_install_tmp }}/db_install.rsp -ignorePrereq"
  become_user: oracle
  environment:
    # OCR registers nodes by BARE name (olsnodes). The DB installer
    # validates 'is THIS system a cluster member' by matching
    # ORACLE_HOSTNAME against that registry — the inventory FQDN makes
    # a perfectly healthy cluster read as INS-35354 (di 2026-10-24,
    # fourth independent root cause of the same error string).
    ORACLE_HOSTNAME: "{{ hostvars[inventory_hostname].short_name | default(inventory_hostname) }}"
    TMPDIR: "{{ grid_install_tmp }}"
    LANG: en_US.UTF-8
  register: db_install
  failed_when: db_install.rc != 0
  timeout: 5400
  changed_when: true
  when:
    - db_phase == 'software'
    - not (db_binary.stat.exists | default(false) and db_binary.stat.size | default(0) > 1048576)
    - inventory_hostname == groups['rac'][0]

- name: Show installer tail (empty list if the task was skipped)
  debug:
    msg: "{{ (db_install.stderr_lines | default([]))[-10:] }}"
  when: db_phase == 'software'

# ------------------------------------------------------------------ root.sh
# Idempotent and cheap (relink/setuid) — run on EVERY node every phase run;
# a node whose propagation died mid-copy NEEDS the re-run.
- name: Run {{ oracle_home }}/root.sh on this node
  command: "{{ oracle_home }}/root.sh"
  register: db_rootsh
  failed_when: db_rootsh.rc != 0
  timeout: 900
  changed_when: true
  when: db_phase == 'root'

- name: Show root.sh tail
  debug:
    msg: "{{ (db_rootsh.stdout_lines | default(['(root stage not run here)']))[-8:] }}"
  when: db_phase == 'root'

# ------------------------------------------------------------------ verify
- name: Verify bin/oracle on every node (propagation completeness)
  stat:
    path: "{{ oracle_home }}/bin/oracle"
  register: db_bin_check
  failed_when: >-
    not db_bin_check.stat.exists or db_bin_check.stat.size < 1048576
  when: db_phase == 'verify'

- name: Verify setuid bit on bin/oracle (root.sh ran on THIS node)
  shell: >-
    /usr/bin/stat -c '%a %U %G' {{ oracle_home }}/bin/oracle
  register: setuid_check
  changed_when: false
  failed_when: not (setuid_check.stdout.split(' ')[0] is match('67.*'))
  when: db_phase == 'verify'

- name: Client TNS aliases (SCAN + per-instance; listeners are CRS resources)
  template:
    src: tnsnames.ora.j2
    dest: "{{ oracle_home }}/network/admin/tnsnames.ora"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'
  when: db_phase == 'verify'

- name: sqlplus version (needs ORACLE_HOME in env or it dies SP2-0667)
  command: "{{ oracle_home }}/bin/sqlplus -version"
  become_user: oracle
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
  register: sqlplus_v
  changed_when: false
  when: db_phase == 'verify'

- name: Show version
  debug:
    msg: "{{ sqlplus_v.stdout | default('(skipped)') }}"
  when: db_phase == 'verify'
