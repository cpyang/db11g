# ============================================================
# Role: database
# Installs Oracle Database 11gR2 Software
# ============================================================

- name: Check if Database software is already installed
  stat:
    path: "{{ oracle_home }}/bin/sqlplus"
  register: db_installed

- name: Skip Database installation if already installed
  debug:
    msg: "Database software already installed on {{ inventory_hostname }}. Skipping."
  when: db_installed.stat.exists

- name: Create Oracle database directories
  file:
    path: "{{ item }}"
    state: directory
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0755'
  loop:
    - "{{ oracle_home }}"
    - "/u01/install_logs/database"

- name: Extract Database software zip files
  unarchive:
    src: "{{ oracle_packages_dir }}/{{ item }}"
    dest: "/u01/install_packages/database"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0755'
  loop:
    - "{{ oracle_database_zip1 }}"
    - "{{ oracle_database_zip2 }}"
  become_user: oracle
  when: not db_installed.stat.exists

- name: Copy Database response file
  template:
    src: db_install.rsp.j2
    dest: /tmp/db_install.rsp
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'

- name: Install Database software (silent mode)
  command: >
    /u01/install_packages/database/runInstaller -silent -responseFile /tmp/db_install.rsp
    -waitforcompletion
    -ignorePrereq
  become_user: oracle
  register: db_install
  changed_when: db_install.rc == 0
  when: not db_installed.stat.exists

- name: Run root.sh for database
  command: "{{ oracle_home }}/root.sh"
  become: true
  when: inventory_hostname == groups['rac'][0] and not db_installed.stat.exists
  register: db_rootsh_result

- name: Display root.sh output
  debug:
    var: db_rootsh_result.stdout_lines
  when: inventory_hostname == groups['rac'][0]

- name: Run root.sh on remaining nodes
  command: "{{ oracle_home }}/root.sh"
  become: true
  when: inventory_hostname != groups['rac'][0] and not db_installed.stat.exists
  register: db_rootsh_result

- name: Display root.sh output on remaining nodes
  debug:
    var: db_rootsh_result.stdout_lines
  when: inventory_hostname != groups['rac'][0]

- name: Configure listener.ora
  template:
    src: listener.ora.j2
    dest: "{{ oracle_home }}/network/admin/listener.ora"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'

- name: Configure tnsnames.ora
  template:
    src: tnsnames.ora.j2
    dest: "{{ oracle_home }}/network/admin/tnsnames.ora"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'

- name: Start listener
  command: "{{ oracle_home }}/bin/lsnrctl start"
  become_user: oracle
  when: inventory_hostname == groups['rac'][0]
  changed_when: true

- name: Verify listener is running
  command: "{{ oracle_home }}/bin/lsnrctl status"
  become_user: oracle
  register: listener_status
  changed_when: false
  retries: 5
  delay: 15
  until: listener_status.rc == 0

- name: Display listener status
  debug:
    var: listener_status.stdout_lines

- name: Verify database software installation
  command: "{{ oracle_home }}/bin/sqlplus -version"
  become_user: oracle
  register: sqlplus_version
  changed_when: false

- name: Display SQL*Plus version
  debug:
    var: sqlplus_version.stdout_lines
