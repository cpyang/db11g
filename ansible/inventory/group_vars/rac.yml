# ============================================================
# RAC cluster variables
# ============================================================

# Interface roles are resolved BY ADDRESS at runtime (never ethX — the box
# carries eth0=NAT first). See roles/common/tasks/main.yml.
network_public_subnet: "{{ network_public }}.0"
network_private_subnet: "{{ network_private }}.0"

# GI rsp values
grid_install_tmp: /u01/tmp
scan_port: 1521

# Disk groups: CRS holds OCR+voting (created by the installer);
# DATA and FRA are created by asmca after root.sh.
asm_diskgroup_crs: CRS
asm_diskgroup_data: DATA
asm_diskgroup_fra: FRA
asm_diskstring: "/dev/oracleasm/disks/*"

# --- Database (playbook 05) ---
db_name: rac
db_unique_name: rac
db_sid_prefix: rac            # instances rac1, rac2 (= prefix + node_num)
db_charset: AL32UTF8
db_ncharset: AL16UTF16
db_memory_percentage: 40
dbca_template: "{{ oracle_home }}/assistants/dbca/templates/General_Purpose.dbc"
